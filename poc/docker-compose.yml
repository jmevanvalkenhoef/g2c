name: g2c-poc

services:
  bitcoind:
    restart: unless-stopped
    image: bitcoin/bitcoin:28.0
    command:
      -regtest
      -txindex=1
      -rpcuser=rpcuser
      -rpcpassword=rpcpass
      -rpcbind=0.0.0.0
      -rpcallowip=0.0.0.0/0
      -fallbackfee=0.0002
    volumes:
      - bitcoind-data:/root/.bitcoin

  # Mines blocks on a timer so channels confirm quickly
  miner:
    restart: unless-stopped
    image: bitcoin/bitcoin:28.0
    depends_on: [bitcoind]
    entrypoint: >
      bash -c '
        set -e
        until bitcoin-cli -regtest -rpcconnect=bitcoind -rpcuser=rpcuser -rpcpassword=rpcpass getblockchaininfo >/dev/null 2>&1; do
          echo waiting for bitcoind; sleep 2
        done
        bitcoin-cli -regtest -rpcconnect=bitcoind -rpcuser=rpcuser -rpcpassword=rpcpass createwallet miner >/dev/null 2>&1 \
          || bitcoin-cli -regtest -rpcconnect=bitcoind -rpcuser=rpcuser -rpcpassword=rpcpass loadwallet miner >/dev/null 2>&1 \
          || true
        ADDR=$$(bitcoin-cli -regtest -rpcconnect=bitcoind -rpcuser=rpcuser -rpcpassword=rpcpass -rpcwallet=miner getnewaddress)
        echo "pre-mining 200 blocks to $$ADDR"
        bitcoin-cli -regtest -rpcconnect=bitcoind -rpcuser=rpcuser -rpcpassword=rpcpass -rpcwallet=miner generatetoaddress 200 $$ADDR >/dev/null
        while true; do
          bitcoin-cli -regtest -rpcconnect=bitcoind -rpcuser=rpcuser -rpcpassword=rpcpass -rpcwallet=miner generatetoaddress 1 $$ADDR >/dev/null
          sleep 15
        done
      '

  # The escrow's node: CLN + BoltzExchange/hold plugin
  cln-escrow:
    restart: unless-stopped
    environment:
      LIGHTNINGD_NETWORK: regtest
    build: ./cln-hold
    depends_on: [bitcoind]
    command: >
      --network=regtest
      --alias=escrow
      --bitcoin-rpcconnect=bitcoind
      --bitcoin-rpcuser=rpcuser
      --bitcoin-rpcpassword=rpcpass
      --funding-confirms=1
      --important-plugin=/usr/local/bin/hold
      --hold-database=sqlite:///root/.lightning/hold.db
      --log-level=info
    volumes:
      - cln-escrow-data:/root/.lightning

  # Buyer node (pays hold invoices)
  cln-buyer:
    restart: unless-stopped
    environment:
      LIGHTNINGD_NETWORK: regtest
    image: elementsproject/lightningd:latest
    depends_on: [bitcoind]
    command: >
      --network=regtest
      --alias=buyer
      --bitcoin-rpcconnect=bitcoind
      --bitcoin-rpcuser=rpcuser
      --bitcoin-rpcpassword=rpcpass
      --funding-confirms=1
      --log-level=info
    volumes:
      - cln-buyer-data:/root/.lightning

  # Seller node (receives escrow payouts)
  cln-seller:
    restart: unless-stopped
    environment:
      LIGHTNINGD_NETWORK: regtest
    image: elementsproject/lightningd:latest
    depends_on: [bitcoind]
    command: >
      --network=regtest
      --alias=seller
      --bitcoin-rpcconnect=bitcoind
      --bitcoin-rpcuser=rpcuser
      --bitcoin-rpcpassword=rpcpass
      --funding-confirms=1
      --log-level=info
    volumes:
      - cln-seller-data:/root/.lightning

  # The REAL escrow service (swap target for the game's ESCROW_URL)
  escrow:
    restart: unless-stopped
    build: ../escrow
    depends_on: [cln-escrow]
    ports:
      - "8002:8000"
    environment:
      GAME_URL: http://host.docker.internal:8000   # game backend runs on the host
      ESCROW_SHARED_SECRET: dev-secret
      FEE_MSAT: "100"
    volumes:
      - escrow-data:/app/data
      # CLN nodes' lightning-dirs, shared so we can reach their RPC sockets
      - cln-escrow-data:/sockets/escrow
      - cln-buyer-data:/sockets/buyer
      - cln-seller-data:/sockets/seller
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Mock of the third-party game API with fault injection
  mock-game:
    restart: unless-stopped
    build: ./mock-game
    ports:
      - "8080:8080"
    environment:
      # global fault mode: off | reject | timeout | server_error
      FAULT_MODE: "off"

volumes:
  bitcoind-data:
  escrow-data:
  cln-escrow-data:
  cln-buyer-data:
  cln-seller-data:
